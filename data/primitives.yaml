# T1 — PET Primitives Registry
#
# Schema version: 1.1
# Cross-references: IDs here are used as foreign keys in pairings.yaml (pet_a, pet_b),
#                   stacks.yaml (added_layer), and sectors.yaml (primary_stacks).
#
# Formalised terms used in this file (definitions in ../GLOSSARY.md):
#   trusted curator, untrusted curator, honest-but-curious adversary, malicious adversary,
#   threshold (k-of-n) trust, hardware-anchored trust, institutional trust,
#   attestation, privacy accountant, parameter manifest, adversary-model declaration,
#   disclosure-risk evaluation, output-clearance log.
#
# IMPORTANT: This data is suggestive and indicative. Maturity stage assessments
# reflect a reading of available peer-reviewed literature and documented deployments
# at time of writing. Reasonable experts will disagree, particularly on maturity_stage,
# which is sensitive to sector context and the evidence threshold applied.
# Edit freely — fork this file and revise any field you disagree with.
#
# maturity_stage scale:
#   1 = Experimental / pilot
#   2 = Repeatable deployment
#   3 = Standardised assurance
#   4 = Audit-ready / procurement-ready

schema_version: "1.1"
last_updated: "2026-05-24"
glossary_ref: "../GLOSSARY.md"

primitives:

  # ----------------------------------------------------------------------
  # Differential Privacy — family entry plus two specific variants.
  # Cards SHOULD use DP-L or DP-C; the legacy 'DP' entry is retained for
  # backward compatibility and as the family pointer.
  # ----------------------------------------------------------------------

  - id: DP
    technique: Differential Privacy (family)
    family: algorithmic
    is_family_pointer: true
    variants: [DP-L, DP-C]
    trust_model: >
      Family-level entry. Differential privacy is parameterised by epsilon (and often
      delta) and applied either at source (local DP) or after aggregation (central DP).
      The two variants have materially different trust assumptions and assurance
      requirements — see DP-L and DP-C for the specific entries. Cards should reference
      the specific variant.
    core_artefacts:
      - see DP-L or DP-C
    bottleneck: See DP-L or DP-C
    maturity_stage: 3
    maturity_notes: >
      Family-level maturity reflects standardised assurance in official statistics
      (central DP) and consumer telemetry (local DP). Variant-specific maturity in
      the DP-L and DP-C entries.
    key_references:
      - "Dwork & Roth (2014) — Algorithmic foundations of differential privacy"
      - "NIST SP 800-226 (Draft, 2023) — DP evaluation guidelines"

  - id: DP-L
    technique: Differential Privacy — local (LDP)
    family: algorithmic
    variant_of: DP
    trust_model: >
      Untrusted curator. Each data subject (or their device) adds noise locally before
      any value leaves the source. The curator never sees raw inputs. Privacy holds
      against an adversarial curator. The cost is borne in utility: large epsilon
      values are typically required to extract useful population-level signal, and
      per-record analytics are impractical.
    core_artefacts:
      - parameter manifest (epsilon per release, noise mechanism, sampling rate)
      - privacy accountant tracking cumulative loss per user per day or session
      - parameter manifest declaring whether the LDP scheme is randomised response,
        RAPPOR-style hashing, or HE-based aggregation with local noise
      - release log (what aggregate statistics were published, against what budget)
      - utility benchmark on the specific statistic of interest
    bottleneck: >
      Utility loss is the dominant cost. Large epsilon values are typical at the
      population scale; small per-user epsilons rapidly destroy utility for
      non-trivial analytics.
    maturity_stage: 3
    maturity_notes: >
      Deployed at large scale for telemetry (Google RAPPOR, Apple DP, Google Privacy
      Sandbox measurement APIs). Tang et al. (2017) document the trade-off between
      configured epsilon and effective privacy at deployment scale, which remains a
      contested aspect of these implementations.
    key_references:
      - "Erlingsson, Pihur & Korolova (2014) — RAPPOR"
      - "Tang et al. (2017) — Privacy loss in Apple's local-DP implementation"
      - "Ghazi et al. (2025) — On the differential privacy and interactivity of Privacy Sandbox reports"

  - id: DP-C
    technique: Differential Privacy — central (CDP)
    family: algorithmic
    variant_of: DP
    trust_model: >
      Trusted curator. The curator receives raw inputs, computes an aggregate, and
      applies noise calibrated to the sensitivity of the query before release. The
      privacy guarantee holds for the release, not within the curator. The trust
      placed in the curator is independent of the DP guarantee itself — usually
      satisfied via an institutional or hardware-anchored mechanism (TRE, TEE).
    core_artefacts:
      - parameter manifest (epsilon, delta, sensitivity, noise mechanism, clipping norm)
      - privacy accountant tracking composition across queries / training steps
      - sensitivity analysis (how much can a single record shift the query result)
      - release log with composition state
      - utility benchmark relative to non-private baseline
    bottleneck: >
      Parameter governance and composition accounting. Setting epsilon, justifying it,
      and tracking cumulative loss across a programme of releases are the dominant
      operational difficulties — not the noise mechanism itself.
    maturity_stage: 3
    maturity_notes: >
      Standardised assurance in some official-statistics contexts (US Census 2020 DAS).
      Adoption by other national statistical institutes is uneven — the UK ONS has
      explored DP but continues to favour cell-key perturbation for headline census
      outputs (Muralidhar et al. 2025; ONS 2023). NIST SP 800-226 (Draft) provides
      the evaluation framework currently used to assess CDP claims.
    key_references:
      - "Dwork & Roth (2014) — Algorithmic foundations"
      - "U.S. Census Bureau (2021) — 2020 Disclosure Avoidance System"
      - "Abadi et al. (2016) — DP-SGD"
      - "Muralidhar et al. (2025) — Critical analysis of 2010/2020 Census methods"

  # ----------------------------------------------------------------------
  # Other algorithmic PETs.
  # ----------------------------------------------------------------------

  - id: MPC
    technique: Secure Multi-Party Computation
    family: algorithmic
    trust_model: >
      Untrusted curator across the participating parties. Adversary model is
      explicitly declared per protocol: honest-but-curious or malicious; static or
      adaptive corruption; threshold (k-of-n) corruption bound. Privacy holds as
      long as the corruption threshold is not exceeded. Survey paper §2.1.1 cites
      this as the dominant adversary-model variation.
    core_artefacts:
      - protocol specification (e.g. SPDZ, ABY3, secret-sharing scheme)
      - adversary-model declaration (semi-honest vs malicious, threshold, static vs adaptive)
      - test vectors and correctness proofs
      - implementation audit (constant-time, side-channel posture)
      - communication benchmark (round complexity, bandwidth per party)
    bottleneck: >
      Communication overhead. Costs scale with party count and circuit depth; in
      WAN settings, communication dominates compute. Survey paper §3.2 cites
      10-1000× plaintext-equivalent slowdowns as indicative rather than stable.
    maturity_stage: 2
    maturity_notes: >
      Selective production in finance (credit scoring, fraud), genomics (iDASH),
      and benchmarking. Domain-specific frameworks (SPDZ, CrypTen) have improved
      usability. Survey paper §4.1.3 notes broad deployment limited by overhead
      and specialist expertise.
    key_references:
      - "Evans, Kolesnikov & Rosulek (2018) — Pragmatic introduction to MPC"
      - "Archer et al. (2018) — From keys to databases: real-world MPC applications"
      - "Knott et al. (2021) — CrypTen"

  - id: HE
    technique: Homomorphic Encryption
    family: algorithmic
    trust_model: >
      Data owner trusts the evaluator only with ciphertext. Security rests on
      lattice-based hardness assumptions (e.g. Ring-LWE). Parameter regime must
      be selected correctly; misparameterisation can silently void guarantees or
      destroy utility. CKKS adds approximate-arithmetic considerations that are
      a separate parameterisation question.
    core_artefacts:
      - parameter set and security level (declared in bits)
      - scheme declaration (BFV, BGV, CKKS, TFHE)
      - precision and approximation bounds (especially CKKS)
      - benchmark suite (per-operation timing, memory profile, bit strength)
      - toolchain and library version manifest
    bottleneck: >
      Compute cost (10^3–10^5× plaintext per the survey's indicative figures);
      memory pressure; workload fit for non-linear operations. Hardware
      acceleration (FPGA, photonic, Intel Heracles) is shifting this frontier
      but production at scale remains constrained.
    maturity_stage: 2
    maturity_notes: >
      Emerging with niche production (IBM HE4Cloud in financial services, encrypted
      identifier checks in cross-jurisdictional fraud screening). Standards activity
      underway (NIST WPEC 2024). Practical mainly for fixed, small-scale inference
      or aggregation currently; broader AI workload feasibility addressed in
      Masalha et al. (2026) and Xue et al. (2025).
    key_references:
      - "Halevi & Shoup (2020) — Design and implementation of HElib"
      - "Cheon et al. (2017) — CKKS for arithmetic on approximate numbers"
      - "Xue et al. (2025) — SoK: Can FHE support general AI computation?"
      - "Alexandru & Rohloff (2024) — Cross-institutional FHE in financial services"

  - id: ZKP
    technique: Zero-Knowledge Proofs
    family: algorithmic
    trust_model: >
      Prover may be malicious; verifier trust anchored in cryptographic soundness
      of the proof system. Zero-knowledge property depends on proof system, circuit
      correctness, and setup model. Trusted setup (zk-SNARK) introduces a distinct
      trust assumption; transparent setups (zk-STARK) avoid this at the cost of
      proof size. Circuit under-constraint is a known practical failure mode
      (Heidari Soureshjani et al. 2023).
    core_artefacts:
      - circuit definition and arithmetic constraints
      - verification key and setup transcript (if trusted setup used)
      - benchmark report (proof size, prover time, verifier time)
      - implementation and toolchain version manifest (frontend, backend, prover)
      - circuit audit covering under-constraint risk
    bottleneck: >
      Prover compute cost; circuit engineering complexity; under-constraint risk.
      Hardware acceleration (GPU-Halo2, prover clusters) shifts costs to
      specialised infrastructure rather than eliminating them.
    maturity_stage: 2
    maturity_notes: >
      Highest maturity in blockchain / Web3 (rollups, verifiable transactions).
      zk-Bench addresses the reproducibility gap (Koch, Rotaru & Rechberger, 2025).
      ZKML is emerging but bottlenecked by proving cost and circuit expressiveness;
      Peng et al. (2026) frame verifiable inference as workflow-specific assurance
      rather than a general substitute for transparency.
    key_references:
      - "Ben-Sasson et al. (2022) — zk-STARK"
      - "Roelink & El-Hajj (2024) — Comparing zkSNARK, zkSTARK, Bulletproof"
      - "Ernstberger et al. (2023) — zk-Bench"
      - "Peng et al. (2026) — Survey of ZKP-based verifiable ML"

  - id: SYN
    technique: Synthetic Data
    family: algorithmic
    trust_model: >
      Privacy is contingent on the generator, the leakage controls applied during
      training, the threat model, and the downstream release context. Synthetic
      data does not provide privacy by construction — formal guarantees require
      explicit coupling to DP-C or to a documented adversarial audit (e.g. TAPAS).
      Residual disclosure risk is frequently underestimated in practice
      (Stadler et al. 2022).
    core_artefacts:
      - disclosure-risk evaluation (membership inference, linkage tests, outlier audit)
      - utility benchmark (task performance vs. real-data baseline)
      - attack-based audit (e.g. TAPAS, NIST DP-Synthetic challenge methodology)
      - generation parameters and model version manifest
      - statement of intended use (mechanism validation, pipeline testing, statistical release)
    bottleneck: >
      Validation burden; regulator and procurer acceptance; privacy-utility prediction
      ex ante. Generators frequently fail to simultaneously prevent inference attacks
      and preserve downstream utility (survey §3.1).
    maturity_stage: 2
    maturity_notes: >
      High uptake across health (Synthea, Simulacrum, SEARCH), public sector
      (CMS DE-SynPUF, ONS synthetic data policy), and finance (J.P. Morgan).
      Assurance practices uneven — many deployments lack formal disclosure-risk
      evaluation. ICO, ODI, OECD guidance converging on evaluation-first posture
      (ODI 2025; Steier et al. 2025).
    key_references:
      - "Stadler, Oprisanu & Troncoso (2022) — Synthetic data anonymisation Groundhog Day"
      - "McKenna et al. (2021) — Winning the NIST DP synthetic data competition"
      - "Houssiau et al. (2022) — TAPAS"
      - "Kaabachi et al. (2025) — Privacy and utility metrics in medical synthetic data"

  # ----------------------------------------------------------------------
  # Architectural PETs.
  # ----------------------------------------------------------------------

  - id: FL
    technique: Federated Learning / Distributed Analytics
    family: architectural
    trust_model: >
      Participants are semi-trusted; the coordinator is typically modelled as
      honest-but-curious. Raw data stays local but model updates can leak
      information (gradient inversion: Zhu & Han 2020; participation inference:
      Nasr et al. 2019). Poisoning and Byzantine update risks require explicit
      mitigations. Privacy of updates is not guaranteed without additional
      algorithmic PETs.
    core_artefacts:
      - training protocol specification (rounds, client sampling, aggregation rule)
      - aggregation rules and secure-aggregation specification (if used)
      - convergence and robustness reports (Byzantine resilience, non-IID handling)
      - audit logs (round participation, update filtering decisions)
      - data-source de-identification statement (pre-training source controls)
    bottleneck: >
      Communication rounds; non-IID data effects; coordination overhead; update
      leakage. The survey paper notes that hospital adoption is often gated by
      site-specific expertise and integration cost (Soltan et al. 2024).
    maturity_stage: 2
    maturity_notes: >
      Pilot-to-operational in healthcare (NVIDIA FLARE, NHS FLIP, OpenSAFELY) and
      technology (Google Gboard FL with DP). Rarely deployed in sensitive settings
      without additional algorithmic PETs (DP, secure aggregation).
    key_references:
      - "McMahan et al. (2017) — Communication-efficient learning of deep networks (FedAvg)"
      - "Kairouz et al. (2021) — Advances and open problems in federated learning"
      - "Bonawitz et al. (2017) — Practical secure aggregation"
      - "Soltan et al. (2024) — NHS FLIP scalable federated learning solution"
      - "Xu et al. (2023) — Federated Learning of Gboard Language Models with DP"

  - id: TEE
    technique: Trusted Execution Environment
    family: architectural
    trust_model: >
      Hardware-anchored trust. Trust in hardware vendor, attestation chain, and
      implementation correctness; OS and hypervisor may be hostile. Side-channel
      attacks (Foreshadow, Spectre, SGX-specific) are a residual risk. Attestation
      proves a measured enclave is running on genuine hardware — it does not prove
      the enclave code is correct.
    core_artefacts:
      - attestation report and enclave measurement
      - dependency manifest (enclave code version, libraries, container digest)
      - side-channel mitigation declaration (constant-time, cache flushing, etc.)
      - key management and provisioning audit
      - vendor-trust statement (which vendor, which platform generation)
    bottleneck: >
      Vendor trust; enclave memory limits; operational key management; side-channel
      posture. Survey paper §3.3 notes that organisations frequently lack the
      expertise required to deploy TEEs securely (Geppert et al. 2022).
    maturity_stage: 3
    maturity_notes: >
      Commercially deployed across major cloud providers (AWS Nitro Enclaves,
      Azure Confidential Computing, Google Confidential VMs). CPU-GPU confidential
      computing for LLM inference is emerging (Mohan et al. 2024; Apple Private
      Cloud Compute). Increasing audit scrutiny; hybrid PETs typically required
      to close residual risks.
    key_references:
      - "Costan & Devadas (2016) — Intel SGX explained"
      - "Geppert et al. (2022) — TEEs: applications and organisational challenges"
      - "Apple Security Engineering and Architecture (2024) — Private Cloud Compute"
      - "Nilsson, Nikbakht Bideh & Brorsson (2020) — Survey of SGX attacks"

  - id: TRE
    technique: Trusted Research Environment
    family: architectural
    trust_model: >
      Institutional trust plus layered technical and procedural safeguards. Relies
      on the Five Safes framework (safe people, projects, data, settings, outputs).
      Output checking and access audits are first-class assurance mechanisms, not
      optional supplements. TREs are socio-technical control regimes; the
      assurance argument depends on the institution as well as the technology.
    core_artefacts:
      - access audit logs and accreditation records
      - output-clearance workflow and decision log
      - data governance documentation (project approvals, data scope, retention)
      - safe-outputs policy and disclosure-control rules
      - Five Safes alignment statement
    bottleneck: >
      Governance latency; human review throughput; institutional capacity. Output
      clearance throughput is a binding constraint at scale (ONS 2024; ADR UK 2024).
    maturity_stage: 4
    maturity_notes: >
      Mature in UK public sector (ONS Secure Research Service, NHS England SDE +
      regional SDEs, ADR UK). The Goldacre Review (2022) catalysed the SDE approach.
      Increasingly the default for sensitive data access in government and health
      research; model for audit-ready PET use when combined with algorithmic PETs
      at the output stage.
    key_references:
      - "ONS (2024) — Secure Research Service guidance and Safe Outputs"
      - "ADR UK (2024) — Output clearance process"
      - "Goldacre Review (2022)"
      - "FiveSafes.org (n.d.)"
