# T2 — Two-PET Pairings
#
# Schema version: 1.1
# Cross-references: pets[] values must exist in primitives.yaml as PRIMITIVE.id.
#                   pair_id values are used as foreign keys in stacks.yaml (base_pair)
#                   and sectors.yaml (primary_stacks).
#
# Alignment: The canonical set below is aligned with the survey paper
# "Survey of PETs Adoption in Real-World Applications" (v3.1), Table 4.2.
# Where the survey treats a combination explicitly, the entry's references and
# representative examples are drawn from the survey first, supplemented with
# other peer-reviewed or deployment-documented sources.
#
# Notes on DP variant:
#   Where a combination uses DP, the typical variant is named (DP-C central, DP-L
#   local). DP-C is the default unless the deployment is consumer telemetry style
#   (RAPPOR, Apple) where DP-L applies.
#
# confidence levels:
#   peer_reviewed         = combination documented in peer-reviewed literature with evaluation
#   deployment_documented = live deployment with published assurance artefacts or case study
#   practitioner_reported = referenced in grey literature, industry reports, or standards docs
#   theoretical           = analytically motivated but no substantive deployment evidence yet
#
# first_documented / evidence_last_updated (added 2026-09):
#   first_documented is the earliest publication year among this entry's own
#   `references` list — a mechanical, conservative rule, not independent
#   historical research. Stated here so it's reproducible and contestable: if
#   you disagree with a date, check the references list, not our judgement —
#   either the list is missing an earlier source (add it) or the date is
#   simply what's currently evidenced.
#   evidence_last_updated is the date this entry's references and confidence
#   level were last checked against current sources. Ages independently of
#   the file-level `last_updated` above, which bumps on any edit to the file.

schema_version: "1.1"
last_updated: "2026-09-02"

pairings:

  - id: P-01
    pets: [FL, DP]
    typical_dp_variant: DP-C
    survey_paper_anchor: "Table 4.2 row 1 (FL + DP); §2.2.1; §4.1.4"
    exposure_problems: [EP-04, EP-01, EP-08]
    combination_logic: >
      Distributed training with formal leakage bounds on model updates (DP-SGD) or
      on the final model release. The DP layer is typically central (curator-side
      noise added during aggregation) when the coordinator is trusted; local DP
      variants exist for cross-device telemetry. Secure aggregation often
      co-deployed as part of the same stack (see S-03).
    artefacts:
      - privacy accountant (epsilon, delta across training rounds; named composition theorem)
      - clipping norm and noise multiplier parameters
      - convergence and utility monitoring logs
      - DP-SGD configuration manifest
      - aggregation rule and coordinator trust statement
    advantage: >
      Formal privacy bound layered onto distributed training. The most extensively
      documented combination in the literature. Google Gboard is the canonical
      production deployment (Xu et al. 2023).
    shortcoming: >
      Accuracy degradation under tight epsilon; accounting complexity compounds
      across rounds; utility loss hard to predict ex ante for heterogeneous
      client distributions; DP applied without secure aggregation leaves a
      coordinator-visibility gap (see S-03).
    confidence: deployment_documented
    first_documented: "2016"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Xu et al. (2023) — Federated Learning of Gboard Language Models with Differential Privacy"
        url: "https://aclanthology.org/2023.acl-industry.60/"
      - text: "Abadi et al. (2016) — Deep learning with differential privacy (DP-SGD)"
        url: "https://arxiv.org/abs/1607.00133"
      - text: "Kairouz et al. (2021) — Advances and open problems in federated learning"
        url: "https://arxiv.org/abs/1912.04977"
      - text: "Liu et al. (2024) — DP Low-Rank Adaptation under federated learning"
        url: "https://arxiv.org/abs/2312.17493"

  - id: P-02
    pets: [FL, MPC]
    survey_paper_anchor: "§2.2.1 (Bonawitz secure aggregation); supports Table 4.2 FL family entries"
    exposure_problems: [EP-04, EP-02]
    combination_logic: >
      Secure aggregation. The coordinator receives only the cryptographically
      aggregated sum of client updates, not individual contributions. Typically
      implemented via additive secret sharing with dropout tolerance. Distinct
      from full MPC over training — applies MPC specifically at the aggregation
      step. Closes the coordinator-visibility gap that P-01 leaves open.
    artefacts:
      - secure-aggregation protocol specification
      - adversary-model declaration (semi-honest coordinator; threshold for collusion)
      - dropout and fault-tolerance handling documentation
      - communication overhead benchmark (per round, per client count)
    advantage: >
      Removes coordinator visibility of per-client updates while preserving
      aggregation correctness. Practically deployed at scale (Bonawitz et al.
      2017 cross-device FL). Recent extensions support stateful aggregation for
      DP-FTRL under an untrusted server model (Ball et al. 2024).
    shortcoming: >
      Communication overhead scales with client count; dropout handling adds
      protocol complexity; does not bound information leakage *from the
      aggregate itself* — needs to be paired with DP (see S-03).
    confidence: deployment_documented
    first_documented: "2017"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Bonawitz et al. (2017) — Practical secure aggregation for privacy-preserving ML"
        url: "https://doi.org/10.1145/3133956.3133982"
      - text: "Ball et al. (2024) — Secure stateful aggregation for DP-FTRL under untrusted server"
        url: ""

  - id: P-03
    pets: [FL, TEE]
    survey_paper_anchor: "Table 4.2 row 2 (FL + TEE); §2.2.2 (TEE in federated settings)"
    exposure_problems: [EP-04, EP-03]
    combination_logic: >
      Local data stays on client devices; the aggregation server runs inside a TEE,
      providing hardware-enforced confidentiality for the aggregation step and any
      intermediate model state. Attestation confirms the aggregation code has not
      been tampered with. Survey paper §2.2.2 cites Intel SGX-based hospital
      federations as the representative example.
    artefacts:
      - attestation report confirming enclave identity and measurement
      - enclave code version manifest
      - aggregation protocol audit
      - side-channel mitigation declaration for the aggregation enclave
      - vendor trust statement
    advantage: >
      Stronger protection for intermediate update state; hardware isolation of
      the aggregation step reduces need for full cryptographic MPC overhead.
    shortcoming: >
      Hardware vendor trust; enclave memory limits can constrain model size; key
      management overhead; does not provide formal bounds on output disclosure
      (see S-01 for DP addition).
    confidence: deployment_documented
    first_documented: "2021"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Intel (2021) — Intel SGX helps Ping An Technology successfully apply federated learning"
        url: "https://www.intel.com/content/dam/www/public/us/en/documents/case-studies/ping-an-technology-sgx-case-study.pdf"
      - text: "NVIDIA FLARE — Federated Learning Application Runtime Environment"
        url: "https://nvflare.readthedocs.io/"

  - id: P-04
    pets: [TEE, DP]
    typical_dp_variant: DP-C
    survey_paper_anchor: "§2.2.2 (combining TEE with output controls); §3.4 (composability)"
    exposure_problems: [EP-03, EP-01, EP-11]
    combination_logic: >
      TEE provides hardware-enforced in-use confidentiality for computation on
      sensitive data; central DP provides formal bounds on what the output reveals
      about any individual. The two mechanisms address orthogonal threat surfaces:
      TEE protects intermediate state, DP protects the release.
    artefacts:
      - attestation report and enclave measurement
      - DP parameter manifest (epsilon, delta, sensitivity, noise mechanism)
      - release log with composition accounting
      - dual trust-model declaration (hardware vendor + parameter governance)
    advantage: >
      Clear functional separation between in-use privacy (TEE) and output
      disclosure risk (DP). Allows each to be audited independently. Common
      pattern in cloud-hosted confidential analytics and the basis for several
      cross-jurisdictional analyses (e.g. the UK-US federated survival pilot
      described in GDS 2025 layers this further with FL — see S-01).
    shortcoming: >
      Dual trust anchors — hardware vendor and correct DP parameterisation —
      both require assurance; composability risk if threat models are misaligned.
    confidence: deployment_documented
    first_documented: "2025"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "ONS Secure Research Service"
        url: "https://www.ons.gov.uk/aboutus/whatwedo/statistics/requestingstatistics/approvedresearcherscheme"
      - text: "AWS Nitro Enclaves"
        url: "https://aws.amazon.com/ec2/nitro/nitro-enclaves/"
      - text: "Government Digital Service (2025) — Using PETs to enable international data sharing"
        url: "https://gds.blog.gov.uk/2025/10/09/using-privacy-enhancing-technologies-to-enable-international-data-sharing/"

  - id: P-05
    pets: [TEE, MPC]
    survey_paper_anchor: "Table 4.2 row 4 (TEE + SMPC); §2.2.2; §4.1.3 (cross-bank fraud)"
    exposure_problems: [EP-02, EP-03]
    combination_logic: >
      Hardware isolation hosts MPC protocol execution, reducing communication
      overhead and providing an additional hardware-enforced confidentiality
      layer for the computation. TEE attestation provides evidence that the
      correct protocol is running. Survey paper §4.1.3 cites the WEF cross-bank
      fraud-analytics pilot as the canonical example.
    artefacts:
      - attestation report
      - MPC protocol specification and adversary-model declaration
      - implementation audit covering both enclave and protocol layers
      - benchmark evidence (latency, throughput, per-party communication)
    advantage: >
      Performance gain for some MPC workloads; hardware isolation reduces the
      trust required in the MPC coordinator or aggregator. Enables otherwise
      impractical multi-party tasks at production latency.
    shortcoming: >
      Hybrid assurance narrative is harder to audit; assurance artefacts span
      both cryptographic and hardware domains; combined attack surface
      (cryptanalysis + hardware exploits) requires explicit threat-model fusion;
      enclave memory limits can constrain MPC circuit size.
    confidence: deployment_documented
    first_documented: "2019"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "World Economic Forum (2019) — Data collaboration for the common good (cross-bank SGX pilot)"
        url: "https://www3.weforum.org/docs/WEF_Data_Collaboration_for_the_Common_Good.pdf"
      - text: "Mastercard (2024) — Privacy enhancing technologies (white paper)"
        url: "https://b2b.mastercard.com/media/z0pnu32l/privacy-enhancing-technologies-white-paper-final.pdf"
      - text: "MP-SPDZ — Versatile framework for multi-party computation"
        url: "https://github.com/data61/MP-SPDZ"

  - id: P-06
    pets: [TEE, ZKP]
    survey_paper_anchor: "Not in Table 4.2 explicitly; §2.1.6 + §2.2.2 (verifiable execution); deferred / theoretical"
    exposure_problems: [EP-07, EP-03]
    combination_logic: >
      TEE provides hardware isolation for the ZKP prover, protecting sensitive
      witness data during proof generation. ZKP provides verifiable correctness
      of the computation result. Together: verifiable execution with reduced
      intermediate disclosure risk. Most often discussed in the ZKML context
      (Chen et al. 2024).
    artefacts:
      - attestation report confirming prover enclave
      - circuit definition and verification keys
      - proof artefacts (proof object, verifier time benchmark)
      - implementation assurance (circuit audit, under-constraint check)
    advantage: >
      Combines hardware-enforced prover privacy with cryptographic verifiability.
      Relevant for verifiable ML inference (ZKML) pipelines where model weights
      are sensitive.
    shortcoming: >
      Specialised infrastructure; proof generation cost remains a bottleneck;
      hybrid assurance spans both hardware and cryptographic domains; limited
      production deployments outside research contexts. Not yet treated by the
      survey as a primary combination.
    confidence: theoretical
    first_documented: "2023"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Chen et al. (2024) — Enabling practical verifiable ML with ZKPs (ZKML)"
        url: ""
      - text: "Ernstberger et al. (2023) — zk-Bench"
        url: "https://eprint.iacr.org/2023/1503.pdf"
      - text: "Chaliasos et al. (2024) — SoK: What don't we know? Understanding security vulnerabilities in SNARKs"
        url: ""

  - id: P-07
    pets: [TRE, DP]
    typical_dp_variant: DP-C
    survey_paper_anchor: "Table 4.2 row 5 (TRE + DP); §4.1.2 (public sector); §3.4 (composability)"
    exposure_problems: [EP-06, EP-01, EP-09]
    combination_logic: >
      Central DP output bounds applied within a governed access environment.
      DP complements (rather than replaces) human output checking — outputs
      must pass both statistical noise bounding and procedural clearance review.
      The TRE provides the institutional accountability layer; DP provides the
      mathematical disclosure bound. Survey paper §4.1.2 cites ONS Safe Outputs
      policy with DP exploration as the representative example.
    artefacts:
      - output-clearance workflow and decision log
      - DP accountant and parameter manifest
      - release policy documentation
      - access and project approval audit records
      - DPIA or equivalent legal-basis documentation
    advantage: >
      Strong fit for public-sector and accredited research settings. The two
      mechanisms address distinct failure modes (procedural and statistical).
      Audit-ready when artefacts are bundled and maintained.
    shortcoming: >
      Governance latency; sign-off burden; DP parameter policy requires
      non-technical domain input; legal sufficiency of DP evidence varies by
      jurisdiction (Kenny et al. 2021; Muralidhar et al. 2025).
    confidence: deployment_documented
    first_documented: "2021"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "ONS (2023) — Protecting personal data in Census 2021 results"
        url: "https://www.ons.gov.uk/peoplepopulationandcommunity/populationandmigration/populationestimates/methodologies/protectingpersonaldataincensus2021results"
      - text: "ONS (2021) — Applying differential privacy protection to ONS mortality data (pilot)"
        url: "https://www.ons.gov.uk/peoplepopulationandcommunity/birthsdeathsandmarriages/deaths/methodologies/applyingdifferentialprivacyprotectiontoonsmortalitydatapilotstudy/pdf"
      - text: "ADR UK (2024) — Five Safes framework for data access"
        url: "https://www.adruk.org/data-access/data-access-framework/"
      - text: "Stanley & Totty (2024) — Synthetic data and the SIPP Synthetic Beta"
        url: ""

  - id: P-08
    pets: [SYN, DP]
    typical_dp_variant: DP-C
    survey_paper_anchor: "Table 4.2 row 6 (Synthetic data + DP); §2.1.5; §4.1.2 (US Census DP-synthetic pilot)"
    exposure_problems: [EP-05, EP-09, EP-10]
    combination_logic: >
      DP formally bounds the privacy loss incurred during generator training
      (e.g. DP-SGD applied to a GAN, VAE, or tabular generator) or at the point
      of synthetic dataset release. Without DP coupling, synthetic data provides
      no formal privacy guarantee; with DP, the release is mathematically bounded
      but typically lower fidelity. The NIST DP Synthetic Data Challenge is the
      methodological reference.
    artefacts:
      - DP training or release parameter manifest (epsilon, delta, mechanism)
      - privacy/utility evaluation (task performance vs. non-private baseline)
      - membership inference audit results (TAPAS or equivalent)
      - disclosure-risk assessment and linking tests
      - generator code and version manifest
    advantage: >
      More legally and evidentially defensible synthetic release than uncoupled
      generation. Cleaner assurance narrative than standalone synthetic data.
      Recognised by ICO, ODI, and US regulators as a viable mechanism for
      controlled releases.
    shortcoming: >
      Lower fidelity than non-private synthetic data; privacy-utility degradation
      is data-dependent and hard to predict ex ante; DP-SGD applied to generative
      models compounds noise across generation steps. Inference attacks remain
      difficult to anticipate beyond standard DP analysis (Houssiau et al. 2022).
    confidence: peer_reviewed
    first_documented: "2018"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "McKenna et al. (2021) — Winning the NIST DP synthetic data competition"
        url: "https://arxiv.org/abs/2108.04978"
      - text: "Xie et al. (2018) — Differentially private GAN"
        url: "https://arxiv.org/abs/1802.06739"
      - text: "Houssiau et al. (2022) — TAPAS adversarial privacy audit"
        url: "https://arxiv.org/abs/2211.06550"
      - text: "Stadler, Oprisanu & Troncoso (2022) — Synthetic data anonymisation Groundhog Day"
        url: "https://www.usenix.org/system/files/sec22-stadler.pdf"

  - id: P-09
    pets: [SDC, TRE]
    survey_paper_anchor: "Not in the survey paper (Smith et al. 2026) — added per DAO 216-26 (2026); see beyond-scalar-epsilon-outline.md §4"
    exposure_problems: [EP-06, EP-01, EP-09]
    combination_logic: >
      Deterministic disclosure control (coarsening, suppression) applied to
      outputs within a governed access environment, in place of — or
      alongside — a formal statistical bound. The TRE provides the
      institutional accountability layer (accreditation, output-clearance
      workflow); SDC provides the release-level protection, assessed by
      rule-based thresholds and human review rather than a re-derivable
      privacy parameter. This is the classical pairing that predates P-07
      (TRE + DP-C): output checking against the frequency rule and, for
      magnitude tables, the (n,k)-dominance or p%-rule, is the default
      disclosure control most TREs were built around, with DP explored later
      and, in some jurisdictions, since walked back (see DAO 216-26 in SDC's
      maturity_notes).
    artefacts:
      - output-clearance workflow and decision log
      - frequency-rule threshold and, where applicable, (n,k)-dominance or
        p%-rule parameters
      - primary/secondary suppression pattern
      - disclosure-risk evaluation (singling-out test, motivated-intruder
        simulation)
      - access and project approval audit records
    advantage: >
      No cryptographic or statistical machinery required; thresholds are
      simple to state in a release policy and easy for a non-specialist
      output-checker or regulator to inspect. The longest-documented
      assurance regime of any pairing in this table — decades of production
      use in national statistics predate every algorithmic PET here.
    shortcoming: >
      No portable, composable privacy guarantee: risk is reassessed by hand
      per release and does not accumulate against a tracked budget the way a
      DP accountant does. Heavy suppression can materially degrade utility
      for small-area or high-dimensional tables; secondary-suppression
      selection does not scale as cleanly as an automated noise mechanism
      once a programme of releases grows large (see SDC bottleneck).
    confidence: deployment_documented
    first_documented: "2012"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Office for National Statistics (2024) — Statistical Disclosure Control policy"
        url: "https://www.ons.gov.uk/aboutus/transparencyandgovernance/datastrategy/datapolicies/statisticaldisclosurecontrol"
      - text: "U.S. Census Bureau (2026) — Understanding the New Disclosure Avoidance Policy"
        url: "https://www.census.gov/newsroom/blogs/director/2026/08/understanding-the-new-disclosure-avoidance-policy.html"
      - text: "U.S. Department of Commerce (2026) — Departmental Administrative Order 216-26: Disclosure Avoidance for Statistical Products"
        url: "https://www.commerce.gov/opog/disclosure-avoidance-statistical-products"
      - text: "Hundepool et al. (2012) — Statistical Disclosure Control (Wiley)"
        url: ""

  - id: P-10
    pets: [TRE, SYN]
    survey_paper_anchor: "Not in Table 4.2 explicitly — promoted from data/exclusions.yaml E-03 following a 2026-09 evidence re-assessment"
    exposure_problems: [EP-06, EP-05]
    combination_logic: >
      A synthetic "development" dataset, generated to mirror the real
      dataset's schema and broad statistical properties, is made available
      outside the TRE so researchers can develop and test analysis code
      before — and typically as a precondition for — being granted
      accredited access to the real data inside the TRE itself. The
      synthetic dataset is not the analysis deliverable; the real analysis
      still runs on real data under full TRE governance. This is distinct
      from P-08 (SYN + DP-C): P-08 is a DP-bounded synthetic release *as*
      the deliverable, whereas P-10 uses synthetic data as a rehearsal
      artefact that feeds into, and shortens, the TRE access pathway.
    artefacts:
      - synthetic-dataset generation methodology and fidelity statement
        (what schema and summary statistics it preserves, and what it does
        not)
      - disclosure-risk evaluation of the synthetic development dataset
        itself — development-only synthetic data is not automatically
        risk-free (Stadler et al. 2022)
      - code-development-to-data-release (CDDR) cycle-time tracking
      - standard TRE accreditation and output-clearance workflow (unchanged
        for the eventual real-data analysis)
    advantage: >
      Shortens the disclosure-review bottleneck substantially: a
      peer-reviewed evaluation of Simulacrum (a synthetic cancer registry
      built by Health Data Insight with NHS England's National Disease
      Registration Service) found an average 2.3-month
      code-development-to-data-release cycle across 18 projects. Lets a
      much larger population of researchers explore feasibility and write
      working code before any of them touch real records, without changing
      the assurance regime applied to the real-data analysis itself.
    shortcoming: >
      The synthetic development dataset's own disclosure risk is a real,
      sometimes overlooked, question in its own right: if it is made too
      faithful to the source data, it constitutes an unmitigated synthetic
      release (SYN's own bottleneck applies to it directly); if it is not
      faithful enough, code developed against it may not behave correctly
      against the real TRE data — a validity gap, not just a privacy one.
      Whether results and code developed on synthetic data reliably
      generalise to the real-data analysis is not verified in general.
    confidence: peer_reviewed
    first_documented: "2022"
    evidence_last_updated: "2026-09-25"
    references:
      - text: "Health Data Insight / NHS England NDRS (2025) — Leveraging Synthetic Data to Facilitate Research: A Collaborative Model for Analyzing Sensitive National Cancer Registry Data in England"
        url: "https://link.springer.com/article/10.1007/s43441-025-00820-z"
      - text: "Office for National Statistics, Data Science Campus — Enabling Data Access through Privacy Preserving Synthetic Data"
        url: "https://datasciencecampus.ons.gov.uk/enabling-data-access-through-privacy-preserving-synthetic-data/"
      - text: "NCRAS guide to using the Simulacrum and submitting code"
        url: "https://assets.publishing.service.gov.uk/media/627398608fa8f57a3d121908/NCRAS_guide_to_using_the_Simulacrum_and_submitting_code.pdf"
      - text: "Stadler, Oprisanu & Troncoso (2022) — Synthetic data anonymisation Groundhog Day"
        url: "https://www.usenix.org/system/files/sec22-stadler.pdf"
