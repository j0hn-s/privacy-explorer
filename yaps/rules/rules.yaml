# YAPS Rule Set — v1.0
#
# Each rule is evaluated against a Privacy Card JSON document.
# Rules are grouped by category prefix:
#
#   IFACE-  Interface risks — what crosses component boundaries
#   COMP-   Composition risks — how PETs interact and where accounting gaps arise
#   ASSUR-  Assurance artefact completeness
#   GOV-    Governance and procedural controls
#   SECTOR- Sector-specific requirements
#   REG-    Regulatory alignment pointers
#   SDC-    Statistical disclosure control (legacy, non-formal disclosure-
#           limitation checks — see data/primitives.yaml SDC entry for why
#           this category exists alongside, not instead of, ASSUR-*/COMP-*)
#
# Severity levels:
#   RED    — high-priority gap; typically blocks deployment readiness
#   AMBER  — notable gap; warrants attention before production
#   GREEN  — informational; best-practice recommendation
#   INFO   — advisory; contextual note, does not affect overall rating
#
# condition_logic: Python-like boolean expression evaluated against the card JSON.
# Supported accessors (all return False / empty list if the field is absent):
#   has_primitive(id)                  — pet_components contains a primitive with this id
#   primitive_status(id)               — implementation_status of a primitive
#   has_pairing(id)                    — architecture_pattern.pairing_ref == id
#   has_stack(id)                      — architecture_pattern.stack_ref == id
#   sector_is(id)                      — deployment_context.sector_ref == id
#   scale_is(s)                        — deployment_context.scale == s
#   artefact_status(name_fragment)     — status of a required_artefact whose name contains fragment
#   governance_has(field, value)       — governance_controls field equals value
#   has_regulation(reg)                — regulatory_context.applicable_regulations contains reg
#   missing_artefact(name_fragment)    — artefact_status(fragment) in ["missing", "planned", None]
#   maturity_stage()                   — assurance_targets.current_maturity_stage (int)
#   output_control_is(value)           — governance_controls.output_control == value
#   audit_log_present()                — governance_controls.audit_log == true
#
# Rules are evaluated in document order. The engine halts at the first RED finding
# unless --full-report is passed.

schema_version: "1.0"
last_updated: "2026-05"

rules:

  # ─── INTERFACE RISKS ────────────────────────────────────────────────────────

  - id: IFACE-001
    name: "FL update leakage — no output protection"
    category: IFACE
    severity: AMBER
    description: >
      Federated Learning distributes training but model updates can leak individual
      records via gradient inversion or membership inference. Without DP or MPC at
      the aggregation step, no formal bound exists on what the coordinator learns
      from individual updates.
    condition_logic: "has_primitive('FL') and not has_any_dp() and not has_primitive('MPC')"
    finding: >
      FL is present but neither DP nor MPC (secure aggregation) are in the stack.
      The aggregation coordinator may observe individual update information.
      Consider adding DP (P-01), MPC secure aggregation (P-02), or both (S-03).
    references:
      - "Zhu et al. (2019) — Deep Leakage from Gradients"
      - "Melis et al. (2019) — Exploiting unintended feature leakage"

  - id: IFACE-002
    name: "TEE output — no formal disclosure bound"
    category: IFACE
    severity: AMBER
    description: >
      A TEE provides hardware-enforced in-use confidentiality but does not constrain
      what information is disclosed in outputs. Without DP at the release boundary,
      query results or model outputs may leak individual-level information.
    condition_logic: "has_primitive('TEE') and not has_any_dp() and not has_primitive('ZKP')"
    finding: >
      TEE is present but no formal output disclosure control (DP or ZKP) is in the
      stack. TEE protects intermediate state only — outputs may still reveal individual
      records. Consider pairing with DP (P-04) or ZKP (P-06).
    references:
      - "Explorer T2 — P-04 (TEE + DP)"
      - "Explorer T2 — P-06 (TEE + ZKP)"

  - id: IFACE-003
    name: "SYN release — no formal privacy guarantee"
    category: IFACE
    severity: RED
    description: >
      Synthetic data provides no formal privacy guarantee by construction. Without
      explicit coupling to DP training/release or a documented adversarial audit,
      re-identification risk is underestimated in a significant proportion of
      deployments.
    condition_logic: "has_primitive('SYN') and not has_any_dp() and missing_artefact('membership inference')"
    finding: >
      SYN is present without DP coupling and without a membership inference audit.
      Synthetic data alone does not guarantee privacy — this is a documented failure
      mode (Stadler et al. 2022, Houssiau et al. 2022). Add DP coupling (P-08) or
      document a completed membership inference audit.
    references:
      - "Stadler et al. (2022) — Synthetic data anonymisation groundhog day"
      - "Houssiau et al. (2022) — TAPAS"
      - "Explorer T2 — P-08 (SYN + DP)"

  - id: IFACE-004
    name: "MPC coordinator trust model undeclared"
    category: IFACE
    severity: AMBER
    description: >
      MPC security properties depend critically on whether the coordinator is modelled
      as honest-but-curious or actively malicious. Without an explicit adversary model
      declaration, the assurance claim is underspecified.
    condition_logic: "has_primitive('MPC') and missing_artefact('adversary model')"
    finding: >
      MPC is present but no adversary model declaration artefact is recorded.
      The trust guarantee of MPC differs substantially between honest-but-curious
      and malicious adversary models. Document the assumed corruption model.
    references:
      - "Evans et al. (2018) — A pragmatic introduction to secure MPC"

  - id: IFACE-005
    name: "ZKP — trusted setup not documented"
    category: IFACE
    severity: AMBER
    description: >
      zk-SNARK systems require a trusted setup ceremony. If the toxic waste from
      setup is not destroyed, the system is compromised. Transparent setups (STARKs)
      avoid this but must be explicitly declared.
    condition_logic: "has_primitive('ZKP') and missing_artefact('setup transcript')"
    finding: >
      ZKP is present but no trusted-setup transcript or transparent-setup declaration
      is recorded. Document whether a trusted setup was used and if so provide the
      ceremony transcript or multi-party setup evidence.
    references:
      - "Ben-Sasson et al. (2022)"

  # ─── COMPOSITION RISKS ──────────────────────────────────────────────────────

  - id: COMP-001
    name: "DP accounting — multi-round composition not documented"
    category: COMP
    severity: RED
    description: >
      DP guarantees compose across queries and training rounds. Without explicit
      composition accounting (advanced composition, RDP, or similar), the true
      privacy loss over the deployment lifetime is unknown and may substantially
      exceed the per-query epsilon claimed.
    condition_logic: "has_any_dp() and missing_artefact('accountant') and missing_artefact('composition')"
    finding: >
      DP is present but no privacy accountant or composition assumptions artefact
      is recorded. Naive composition inflates total epsilon; advanced composition
      (Kairouz et al. 2015, RDP accounting) must be documented. Add a privacy
      accountant to the required_artefacts list.
    references:
      - "Kairouz et al. (2015) — The composition theorem for differential privacy"
      - "NIST SP 800-226 (Draft)"

  - id: COMP-002
    name: "FL + DP — DP applied after insecure aggregation"
    category: COMP
    severity: AMBER
    description: >
      When FL uses DP without secure aggregation, the coordinator sees individual
      noised updates before summation. This means the coordinator can learn more
      than the sum, defeating part of the DP guarantee. DP-SGD was designed for
      a trusted curator setting; if the coordinator is untrusted, MPC secure
      aggregation should precede DP noise addition.
    condition_logic: "has_primitive('FL') and has_any_dp() and not has_dp_variant('local') and not has_primitive('MPC')"
    finding: >
      FL + DP stack without MPC secure aggregation. If the coordinator is modelled
      as honest-but-curious or untrusted, individual DP-noised updates are visible
      before summation. Consider S-03 (FL + MPC + DP) if coordinator trust is limited.
    references:
      - "Bonawitz et al. (2017)"
      - "Explorer T3 — S-03 (FL + MPC + DP)"

  - id: COMP-003
    name: "TEE + DP — dual trust anchors not explicitly declared"
    category: COMP
    severity: AMBER
    description: >
      Combining TEE and DP introduces two distinct trust requirements: hardware
      vendor trust (for TEE) and parameter governance (for DP). If these are not
      explicitly declared in the trust model, the combined assurance claim is
      harder to audit and may be misread as stronger than it is.
    condition_logic: "has_primitive('TEE') and has_any_dp() and missing_artefact('trust model declaration')"
    finding: >
      TEE + DP stack without a dual trust model declaration. Document that this
      architecture requires (a) trust in the TEE hardware vendor and attestation
      chain, and (b) correct DP parameterisation and composition accounting.
      See Explorer T2 — P-04 shortcomings.
    references:
      - "Explorer T2 — P-04 (TEE + DP)"

  - id: COMP-004
    name: "Three-layer stack — composability risk not assessed"
    category: COMP
    severity: AMBER
    description: >
      Three-PET stacks introduce interaction effects between layers. If the threat
      models of individual layers are not explicitly aligned, a gap may exist at
      the interfaces (e.g. TEE attestation does not verify that DP parameterisation
      is correct).
    condition_logic: "has_stack('S-01') or has_stack('S-02') or has_stack('S-03') or has_stack('S-04')"
    finding: >
      A three-PET stack is declared. Verify that the threat models of each layer
      are explicitly aligned and that no gap exists at layer interfaces. The
      assurance narrative should state what each layer covers and what it does not.
      See Explorer T3 for layer-specific artefact requirements.
    references:
      - "Explorer T3"

  # ─── ASSURANCE ARTEFACT COMPLETENESS ────────────────────────────────────────

  - id: ASSUR-001
    name: "TEE — attestation report not recorded"
    category: ASSUR
    severity: RED
    description: >
      TEE provides in-use confidentiality via hardware attestation. Without a
      recorded attestation report, there is no verifiable evidence that the
      expected code is running on genuine hardware.
    condition_logic: "has_primitive('TEE') and missing_artefact('attestation')"
    finding: >
      TEE is present but no attestation report artefact is recorded. Attestation
      is the primary assurance mechanism for TEEs — without it, the hardware
      isolation claim is unverified. Add attestation report to required_artefacts.
    references:
      - "Costan & Devadas (2016) — Intel SGX explained"

  - id: ASSUR-002
    name: "SYN — no disclosure risk evaluation"
    category: ASSUR
    severity: RED
    description: >
      Synthetic data deployments require a formal disclosure risk evaluation to
      support any privacy claim. Absent this, the synthetic release is unauditable.
    condition_logic: "has_primitive('SYN') and missing_artefact('disclosure-risk')"
    finding: >
      SYN is present but no disclosure-risk evaluation artefact is recorded.
      A disclosure risk evaluation (membership inference test, linkage test, or
      equivalent) is required for any substantive synthetic data privacy claim.
    references:
      - "ICO Anonymisation Code of Practice (2022)"
      - "Explorer T1 — SYN core_artefacts"

  - id: ASSUR-003
    name: "DP — parameter manifest missing"
    category: ASSUR
    severity: RED
    description: >
      A DP deployment without a documented parameter manifest (epsilon, delta,
      noise mechanism, clipping norm) is unauditable. Schema 2.0 reads the
      manifest from `pet_components[].parameters` directly (so a card does
      not need a separately-listed artefact entry); the rule falls back to
      the legacy `missing_artefact('parameter manifest')` check for 1.x
      cards that still record the manifest as a named artefact rather than
      inline parameters.
    condition_logic: "has_any_dp() and not dp_has_parameter_manifest() and missing_artefact('parameter manifest') and missing_artefact('accountant log')"
    finding: >
      DP is present but no parameter manifest is recorded — neither inline on
      `pet_components[].parameters` (schema 2.0: epsilon, delta, noise_mechanism,
      clipping_norm) nor as a named artefact under `assurance_targets`. Epsilon,
      delta, noise mechanism, and clipping/sensitivity values must be documented
      for the privacy claim to be reproducible or auditable.
    references:
      - "NIST SP 800-226 (Draft) — DP evaluation guidelines"
      - "Dwork & Roth (2014)"

  - id: ASSUR-004
    name: "MPC — implementation audit not present"
    category: ASSUR
    severity: AMBER
    description: >
      MPC implementations are complex and often have subtle errors. An implementation
      audit by a third party is a best-practice requirement before production deployment.
    condition_logic: "has_primitive('MPC') and missing_artefact('implementation audit') and not scale_is('pilot')"
    finding: >
      MPC is present in a non-pilot deployment without a recorded implementation audit.
      MPC protocol implementations should be independently audited before production.
    references:
      - "Evans et al. (2018)"

  - id: ASSUR-005
    name: "ZKP — circuit audit not documented"
    category: ASSUR
    severity: AMBER
    description: >
      Under-constrained ZKP circuits allow provers to generate false proofs.
      A circuit correctness and under-constraint audit is required for any
      production ZKP deployment.
    condition_logic: "has_primitive('ZKP') and missing_artefact('circuit audit') and not scale_is('pilot')"
    finding: >
      ZKP is present in a non-pilot deployment without a circuit audit artefact.
      Under-constrained circuits are a known failure mode. Document a circuit
      correctness review before production deployment.
    references:
      - "Ernstberger et al. (2023) — zk-Bench"

  # ─── GOVERNANCE ─────────────────────────────────────────────────────────────

  - id: GOV-001
    name: "No audit log declared"
    category: GOV
    severity: AMBER
    description: >
      An audit log of access and release decisions is a minimum governance
      requirement for any production PET deployment handling personal data.
    condition_logic: "not audit_log_present() and not scale_is('pilot')"
    finding: >
      No audit log is declared for this non-pilot deployment. Access decisions,
      output releases, and parameter changes should be logged and retained.
      Set governance_controls.audit_log = true and document the log location.
    references:
      - "NIST Privacy Framework 1.0 — GOVERN function"
      - "ISO/IEC 27701:2019"

  - id: GOV-002
    name: "TRE — no output checking mechanism declared"
    category: GOV
    severity: RED
    description: >
      TRE deployments rely on output checking as a first-class assurance
      mechanism. Without a declared output control mechanism, the procedural
      governance claim of the TRE is unsubstantiated.
    condition_logic: "has_primitive('TRE') and output_control_is('none')"
    finding: >
      TRE is present but output_control is set to none. TREs require output
      checking (human, automated statistical, or both) as a core assurance
      mechanism. This is a RED finding.
    references:
      - "ONS Safe Outputs guidance (2024)"
      - "Five Safes Framework"

  - id: GOV-003
    name: "No DPIA reference for special-category data"
    category: GOV
    severity: AMBER
    description: >
      Processing special-category data (health, biometric, genetic) typically
      requires a Data Protection Impact Assessment under GDPR Art. 35 and
      equivalent regulations. Absence of a DPIA reference is a governance gap.
    condition_logic: "(has_regulation('UK GDPR') or has_regulation('EU GDPR')) and not governance_controls.get('dpia_reference')"
    finding: >
      GDPR applies to this deployment but no DPIA reference is recorded.
      If special-category data is processed, a DPIA is likely required under
      Art. 35. Record the DPIA reference in governance_controls.dpia_reference.
    references:
      - "GDPR Art. 35"
      - "ICO DPIA guidance"

  - id: GOV-004
    name: "No governance framework alignment declared"
    category: GOV
    severity: GREEN
    description: >
      Aligning explicitly to a recognised governance framework (Five Safes,
      NIST Privacy Framework, ISO/IEC 27701) improves assurance credibility
      and simplifies procurement review.
    condition_logic: "len(governance_controls.get('frameworks_applied', [])) == 0"
    finding: >
      No governance framework alignment is declared. Consider documenting
      alignment (full, partial, or aspirational) with at least one of: Five Safes,
      NIST Privacy Framework 1.0, ISO/IEC 27701, or ICO Anonymisation Code.
    references:
      - "NIST Privacy Framework 1.0"
      - "ISO/IEC 27701:2019"

  # ─── SECTOR-SPECIFIC ─────────────────────────────────────────────────────────

  - id: SECTOR-001
    name: "Healthcare — clinical validity evidence missing"
    category: SECTOR
    severity: AMBER
    description: >
      In healthcare deployments, technical privacy artefacts are necessary but
      not sufficient. Domain-specific utility evidence (AUROC, sensitivity/specificity,
      task benchmarks) is required alongside technical privacy documentation.
    condition_logic: "sector_is('healthcare') and not has_primitive('TRE')"
    finding: >
      Healthcare deployment detected without TRE governance layer. Clinical
      deployments typically require institutional approval processes and
      domain-specific utility evidence (AUROC, task benchmarks) alongside
      technical PET artefacts. Consider adding TRE to the stack and documenting
      a clinical validation process.
    references:
      - "Explorer T4 — healthcare sector assurance posture"
      - "Sheller et al. (2020)"

  - id: SECTOR-002
    name: "Public sector — TRE governance expected"
    category: SECTOR
    severity: AMBER
    description: >
      Public sector and official statistics deployments typically require a
      Trusted Research Environment or equivalent governed access regime.
      DP or synthetic data alone is insufficient for the accountability standard
      expected in public sector contexts.
    condition_logic: "sector_is('public_sector') and not has_primitive('TRE')"
    finding: >
      Public sector deployment without a TRE governance layer. Formal output
      control and access audit mechanisms (Five Safes or equivalent) are expected
      assurance requirements in this sector. Consider adding TRE to the stack.
    references:
      - "Explorer T4 — public sector assurance posture"
      - "ONS (2024)"

  - id: SECTOR-003
    name: "Technology platform — parameter drift risk"
    category: SECTOR
    severity: AMBER
    description: >
      At platform scale, DP parameters that are acceptable for a single release
      may become unacceptable under composition across millions of releases.
      A parameter governance process (review cadence, composition budget tracking)
      is required.
    condition_logic: "sector_is('technology') and has_any_dp() and scale_is('platform-scale') and missing_artefact('composition')"
    finding: >
      Platform-scale technology deployment with DP but no composition accounting.
      At population scale, naive composition of per-release epsilon values produces
      a meaningless total budget. Document composition accounting across releases.
    references:
      - "Explorer T4 — technology platforms blocker"
      - "NIST SP 800-226 (Draft)"

  - id: SECTOR-004
    name: "Finance — performance benchmarks expected"
    category: SECTOR
    severity: GREEN
    description: >
      Finance sector deployments justify specialist engineering costs through
      performance evidence. Without latency and throughput benchmarks, the
      commercial case for MPC or TEE overhead is hard to substantiate.
    condition_logic: "sector_is('finance') and (has_primitive('MPC') or has_primitive('TEE')) and missing_artefact('benchmark')"
    finding: >
      Finance deployment with MPC or TEE but no performance benchmark artefact.
      Documenting latency and throughput benchmarks strengthens the commercial
      justification and supports procurement review.
    references:
      - "Explorer T4 — finance dominant assurance anchor"

  # ─── REGULATORY ALIGNMENT ────────────────────────────────────────────────────

  - id: REG-001
    name: "NIST SP 800-226 alignment not assessed (DP deployments)"
    category: REG
    severity: GREEN
    description: >
      NIST SP 800-226 (Draft, 2023) provides evaluation guidelines for differential
      privacy deployments. It is the primary US federal reference for DP parameter
      governance and legal sufficiency assessment.
    condition_logic: "has_any_dp()"
    finding: >
      DP is present. Document alignment with NIST SP 800-226 (Draft) in
      regulatory_context.standards_alignment. This is the primary reference for
      DP evaluation criteria and parameter governance requirements in US federal
      and international contexts.
    references:
      - "NIST SP 800-226 — Guidelines for Evaluating Differential Privacy Guarantees (Draft 2023)"

  - id: REG-002
    name: "ICO PETs guidance alignment not assessed (UK deployments)"
    category: REG
    severity: GREEN
    description: >
      The ICO's 2023 PETs guidance is the primary UK regulatory reference for
      PET deployment expectations. Alignment should be documented for any
      UK-regulated deployment.
    condition_logic: "has_regulation('UK GDPR')"
    finding: >
      UK GDPR applies. Document alignment with ICO PETs Guidance (2023) and
      ICO Anonymisation Code of Practice (2022) in regulatory_context.standards_alignment.
    references:
      - "ICO PETs Guidance (2023)"
      - "ICO Anonymisation Code of Practice (2022)"

  - id: REG-003
    name: "GDPR Art. 25 — data protection by design"
    category: REG
    severity: INFO
    description: >
      GDPR Art. 25 requires data protection by design and by default. A Privacy Card
      documents the technical implementation of this obligation. The card itself is
      a governance artefact supporting Art. 25 compliance.
    condition_logic: "has_regulation('UK GDPR') or has_regulation('EU GDPR')"
    finding: >
      This Privacy Card can serve as an Art. 25 technical documentation artefact.
      Ensure it is referenced in the DPIA and data protection register.
    references:
      - "GDPR Art. 25 — Data protection by design and by default"
      - "EDPB Guidelines 4/2019 on Art. 25"

  # ─── STEPWISE-CONSTRUCTION VALIDATION (schema 1.1) ──────────────────────────
  # These rules validate cards that opt into the stepwise-from-private
  # construction methodology (STEPWISE_RISK.md). Cards without a stepwise_chain
  # are not penalised by STEP-001; the chain is encouraged but optional.

  - id: STEP-001
    name: "No stepwise chain declared"
    category: STEP
    severity: GREEN
    description: >
      The card does not declare a stepwise_chain. Stepwise-from-private
      construction is recommended for multi-PET deployments because each
      deviation from the completely-private baseline is documented with its
      purpose, exposure problem, trust assumption added, and residual risk.
    condition_logic: "not has_steps() and len(governance_controls) > 0"
    finding: >
      Consider declaring a stepwise_chain that documents how this architecture
      deviates from a completely-private baseline. See STEPWISE_RISK.md for the
      methodology and CARDS_GUIDE.md for a worked example.
    references:
      - "Privacy Explorer — STEPWISE_RISK.md"

  - id: STEP-002
    name: "Stepwise chain — required field missing on a step"
    category: STEP
    severity: RED
    description: >
      Every step in a stepwise chain must declare all six fields: purpose,
      exposure_problem_ref, pet_added, trust_assumption_added, assurance_anchor,
      residual_risk. A step missing any field is not yet a complete deviation
      and cannot be evaluated.
    condition_logic: >
      has_steps() and not (
        each_step_has('purpose') and
        each_step_has('exposure_problem_ref') and
        each_step_has('pet_added') and
        each_step_has('trust_assumption_added') and
        each_step_has('assurance_anchor') and
        each_step_has('residual_risk')
      )
    finding: >
      One or more steps in the stepwise_chain is missing a required field.
      Each step must declare purpose, exposure_problem_ref, pet_added,
      trust_assumption_added, assurance_anchor, and residual_risk before the
      step can be considered well-formed.
    references:
      - "Privacy Explorer — STEPWISE_RISK.md"

  - id: STEP-003
    name: "Stepwise chain — final residual risk empty or trivial"
    category: STEP
    severity: AMBER
    description: >
      The final step's residual_risk records what remains exposed after all
      deviations from the baseline. An empty or trivial residual is implausible
      for any non-trivial PET stack and suggests the card author has not
      surfaced the actual residual risk.
    condition_logic: "has_steps() and not final_residual_declared()"
    finding: >
      The final step in the chain has no residual_risk declared. Even
      defence-in-depth stacks have residuals — hardware vendor compromise,
      side-channel surfaces not covered, parameter governance drift. Document
      what remains after all steps have been applied.
    references:
      - "Privacy Explorer — STEPWISE_RISK.md"

  - id: STEP-004
    name: "Stepwise chain — PET added in step not in pet_components"
    category: STEP
    severity: AMBER
    description: >
      A PET added in a chain step should also appear in the pet_components
      array. Mismatch suggests the chain and the component list have drifted
      apart, which weakens the audit story.
    condition_logic: "has_steps() and not step_pets_match_components()"
    finding: >
      At least one step's pet_added is not present in pet_components. Reconcile
      the stepwise_chain and pet_components — every PET added across the chain
      should appear as a component.
    references:
      - "Privacy Explorer — STEPWISE_RISK.md"

  - id: STEP-005
    name: "Stepwise chain — only one or two steps"
    category: STEP
    severity: INFO
    description: >
      A chain with very few steps may not capture the architectural rationale.
      This is informational; some genuinely simple deployments only have one
      deviation from baseline.
    condition_logic: "has_steps() and step_count() < 3 and len(governance_controls) > 0"
    finding: >
      The stepwise_chain has fewer than three steps. For a single-PET deployment
      this can be correct; for multi-PET stacks (FL+TEE+DP, TRE+TEE+DP) the
      chain typically has four or more steps. Review whether intermediate steps
      have been collapsed.
    references:
      - "Privacy Explorer — STEPWISE_RISK.md"

  # ─── EXPOSURE-PROBLEM (T0) DECLARATION (schema 1.1) ─────────────────────────

  - id: T0-001
    name: "No exposure problem declared"
    category: T0
    severity: GREEN
    description: >
      Declaring which T0 exposure problems this card responds to makes the
      rationale for the chosen PET stack explicit. A card that names neither
      card-level exposure_problem_refs nor per-step EP refs leaves the reader
      to infer the architectural rationale.
    condition_logic: "not declares_exposure_problem()"
    finding: >
      No exposure problem references found. Declare exposure_problem_refs at
      card level or exposure_problem_ref on each step in the stepwise_chain.
      See EXPOSURE_PROBLEMS.md (T0) for the list of named exposure problems.
    references:
      - "Privacy Explorer — EXPOSURE_PROBLEMS.md"

  - id: T0-002
    name: "FL deployment does not declare EP-04 or EP-02"
    category: T0
    severity: INFO
    description: >
      Federated learning typically responds to EP-04 (distributed model
      training where updates may leak) or EP-02 (data cannot leave its source
      for joint computation). A card with FL that declares neither has an
      uncommon rationale that may be worth surfacing explicitly.
    condition_logic: "has_primitive('FL') and not declares_exposure_problem('EP-04') and not declares_exposure_problem('EP-02')"
    finding: >
      FL is present but the card declares neither EP-04 nor EP-02. If the
      FL deployment is for a different reason (e.g. communication-efficiency,
      not privacy), record that rationale in the card description; if privacy
      is the rationale, declare the relevant EP.
    references:
      - "EXPOSURE_PROBLEMS.md EP-02, EP-04"

  - id: T0-003
    name: "Stack uses SYN but does not declare EP-05"
    category: T0
    severity: INFO
    description: >
      Synthetic data is the canonical response to EP-05 (sharing or
      republishing a dataset-shaped artefact). A SYN deployment without EP-05
      in the declared exposure problems suggests an unusual rationale that
      should be made explicit.
    condition_logic: "has_primitive('SYN') and not declares_exposure_problem('EP-05')"
    finding: >
      SYN is present but EP-05 is not declared. Verify whether the synthetic
      data is being used to share a dataset-shaped artefact (EP-05) or for a
      different purpose, and declare the appropriate exposure problem.
    references:
      - "EXPOSURE_PROBLEMS.md EP-05"

  # ─── DP VARIANT ASSURANCE (schema 1.1) ──────────────────────────────────────

  - id: DP-VAR-001
    name: "Local DP — per-user budget not documented"
    category: ASSUR
    severity: RED
    description: >
      Local DP (LDP) typically operates with a per-user, per-time-window
      privacy budget rather than a single global epsilon. Without this
      explicitly documented, the LDP privacy claim cannot be sustained over
      repeated interactions.
    condition_logic: "has_dp_variant('local') and missing_artefact('per-user')"
    finding: >
      DP-L (local DP) is present but no per-user privacy-budget artefact is
      recorded. LDP requires a per-user, per-time-window budget accounting;
      population-scale aggregate budgets are not sufficient. Document the
      per-user budget in the parameter manifest and accountant artefacts.
    references:
      - "Erlingsson, Pihur & Korolova (2014) — RAPPOR"
      - "Tang et al. (2017) — Privacy loss in Apple's LDP implementation"

  - id: DP-VAR-002
    name: "Central DP — trusted curator and composition theorem not named"
    category: ASSUR
    severity: AMBER
    description: >
      Central DP relies on a trusted curator that observes raw inputs before
      adding noise. Both the curator's trust anchor (institutional or
      hardware-anchored) and the composition theorem used (basic, advanced,
      RDP, PRV) should be explicitly named.
    condition_logic: "has_dp_variant('central') and missing_artefact('composition')"
    finding: >
      DP-C (central DP) is present but no composition assumption / theorem
      artefact is recorded. Document which composition theorem the accountant
      uses (e.g. RDP, PRV, Kairouz et al. advanced composition) and the trust
      anchor of the curator.
    references:
      - "Kairouz, Oh & Viswanath (2015) — advanced composition"
      - "Mironov (2017) — Rényi DP"

  - id: DP-VAR-003
    name: "DP family pointer used (DP not DP-L/DP-C)"
    category: ASSUR
    severity: INFO
    description: >
      The bare `DP` primitive id is retained as a family pointer for legacy
      compatibility. New cards should declare the specific variant (DP-L or
      DP-C) so the trust model is unambiguous.
    condition_logic: "has_primitive('DP')"
    finding: >
      This card uses the legacy `DP` primitive id. Schema 1.1 supports `DP-L`
      (local) and `DP-C` (central) as distinct variants with different trust
      models. Consider updating to the specific variant.
    references:
      - "GLOSSARY.md §1"
      - "data/primitives.yaml — DP, DP-L, DP-C entries"

  # ─── JURISDICTIONAL CONTEXT (schema 1.1) ────────────────────────────────────

  - id: JURIS-001
    name: "No jurisdictional context declared"
    category: GOV
    severity: AMBER
    description: >
      Privacy obligations differ by jurisdiction of data subjects, controllers,
      and operators. A card that does not declare jurisdictional context
      cannot be reviewed against the appropriate regulatory regime.
    condition_logic: "not has_jurisdictional_context() and not scale_is('pilot')"
    finding: >
      No jurisdictional_context block is present for this non-pilot deployment.
      Declare the jurisdictions of data subjects, controllers, and operators —
      cross-jurisdictional deployments are increasingly common (e.g. GDS 2025)
      and the framework treats them as a recurring pattern (EP-11).
    references:
      - "EXPOSURE_PROBLEMS.md EP-11"
      - "data/sectors.yaml — idiosyncratic_constraints per sector"

  - id: JURIS-002
    name: "Cross-jurisdictional deployment without cross-border mechanism"
    category: GOV
    severity: RED
    description: >
      When data subjects, controllers, or operators sit in different
      jurisdictions, a cross-border transfer mechanism is typically required
      (UK IDTA, EU SCCs, adequacy decision, section 251 NHS Act 2006, etc.).
    condition_logic: "is_cross_jurisdictional() and not governance_controls.get('dpia_reference')"
    finding: >
      The jurisdictional_context declares a cross-jurisdictional deployment
      but no DPIA reference or cross-border mechanism is recorded. Document
      the legal basis for cross-border data flow (SCCs, adequacy, IDTA, etc.)
      in jurisdictional_context.cross_border_mechanism and link the DPIA.
    references:
      - "EXPOSURE_PROBLEMS.md EP-11"
      - "GDS (2025) — Using PETs to enable international data sharing"

  - id: JURIS-003
    name: "Healthcare deployment without DSPT/HIPAA alignment"
    category: SECTOR
    severity: AMBER
    description: >
      Healthcare deployments typically require alignment with sector-specific
      assurance regimes (NHS DSPT in the UK, HIPAA Security Rule in the US,
      HRA/REC approval pathways). The framework's idiosyncratic_constraints
      block in sectors.yaml lists these.
    condition_logic: "sector_is('healthcare') and not aligns_to_framework('DSPT') and not aligns_to_framework('HIPAA') and not aligns_to_framework('NHS') and not aligns_to_framework('HRA')"
    finding: >
      Healthcare deployment with no DSPT, HIPAA, NHS, or HRA framework
      alignment declared. The idiosyncratic_constraints block for healthcare
      lists the relevant regimes; declare at least one in
      governance_controls.frameworks_applied.
    references:
      - "data/sectors.yaml — healthcare idiosyncratic_constraints"

  # ─── RISK CALIBRATION (schema 1.2) ──────────────────────────────────────────
  # These rules surface the absence of operationally-legible DP reporting on
  # cards that declare any DP variant. They complement (do not replace) the
  # existing DP-VAR-* / ASSUR-003 rules, which check for ε/δ parameter
  # manifests. The risk_calibration block adds the μ-DP / attack-target
  # framing per Desfontaines (2023) and the interpretable-dp.org toolchain.
  #
  # First-iteration severities are intentionally light (GREEN/AMBER/INFO).
  # Workshop feedback may justify escalating RISKCAL-001 to AMBER in a later
  # rule-set revision; do not pre-escalate without that signal.

  - id: RISKCAL-001
    name: "DP declared without operational interpretation"
    category: RISKCAL
    severity: GREEN
    description: >
      A single ε value (paired with δ) masks the underlying privacy trade-off:
      different (ε, δ) pairs can have materially different operational privacy
      properties at the relevant attack operating point (Desfontaines 2023).
      Cards that declare any DP variant should also declare an operational
      interpretation — a μ-DP equivalent, a stated attack-rate target, or
      both — so reviewers can read the privacy claim without re-deriving it.
    condition_logic: "has_any_dp() and not has_risk_calibration()"
    finding: >
      A DP variant is present but no `risk_calibration` block is recorded.
      Consider adding `risk_calibration.mu_dp` (Gaussian-DP single-parameter
      summary) or `risk_calibration.attack_target` (e.g. MIA TPR at FPR=0.001
      bounded at X). The `gdpnum` library converts (ε, δ) to μ-DP and produces
      the trade-off curve; `riskcal` calibrates noise to a target attack rate.
    references:
      - "Desfontaines (2023) — Reporting privacy guarantees in machine learning"
      - "interpretable-dp.org — gdpnum, riskcal"
      - "Dong, Roth & Su (2022) — Gaussian Differential Privacy"

  - id: RISKCAL-002
    name: "μ-DP reported without conversion regret"
    category: RISKCAL
    severity: AMBER
    description: >
      Collapsing (ε, δ) to a single μ-DP value is lossy in general: the regret
      between the underlying privacy curve and its single-parameter Gaussian
      approximation varies across operating points. Reporting μ-DP without
      bounding the regret hides whether the summary is faithful for the
      relevant attack target. Per Desfontaines, regret above ~0.01 indicates
      the single-parameter summary is materially lossy and the full trade-off
      curve should be reported alongside.
    condition_logic: "risk_calibration_field('mu_dp') is not None and risk_calibration_field('conversion_regret') is None"
    finding: >
      `risk_calibration.mu_dp` is reported but `risk_calibration.conversion_regret`
      is absent. Compute the regret using `gdpnum` at the operating point of
      interest; if regret > 0.01, attach a trade-off curve via
      `risk_calibration.trade_off_curve_ref` instead of relying on μ alone.
    references:
      - "Desfontaines (2023) — Reporting privacy guarantees in machine learning"
      - "interpretable-dp.org — gdpnum"

  - id: RISKCAL-003
    name: "DP-coupled synthetic data without trade-off curve"
    category: RISKCAL
    severity: INFO
    description: >
      Synthetic data coupled to DP (P-08 / S-04) benefits from an explicit
      FPR-vs-FNR trade-off curve over the relevant attack (typically MIA).
      Single-point ε/δ reporting hides the tail; Carlini et al. (2022) showed
      that worst-record attack risk can be orders of magnitude higher than
      the average. The curve makes the tail visible.
    condition_logic: "has_primitive('SYN') and has_any_dp() and risk_calibration_field('trade_off_curve_ref') is None"
    finding: >
      SYN + DP is present but no `risk_calibration.trade_off_curve_ref` is
      recorded. Produce a curve via `gdpnum.plot` or via an empirical
      ROC sweep (e.g. from a TAPAS or per-record MIA run) and reference it
      from the card.
    references:
      - "Carlini et al. (2022) — Membership inference attacks from first principles"
      - "Houssiau et al. (2022) — TAPAS"
      - "interpretable-dp.org — gdpnum"

  # ─── Schema 2.0 RISKCAL extensions ─────────────────────────────────────────
  # Added with the 2.0 schema. These rules read the restructured
  # risk_calibration block (design_target / accountant / empirical_audit /
  # measured_advantage) rather than the 1.2 flat structure. Cards in 1.x form
  # are auto-migrated by the engine before evaluation, so the rules see the
  # canonical 2.0 paths either way.

  - id: RISKCAL-004
    name: "Measured attack rate exceeds design target"
    category: RISKCAL
    severity: AMBER
    description: >
      The card declares an operational target attack-rate at a stated FPR
      (`design_target.attack_target.target_advantage`) and reports an empirical
      measured rate from a SOTA attack (`measured_advantage.value`). When
      measured > target, the deployment's operational bound has been breached
      at the point estimate. This is the operational complement to the
      accountant epsilon — what the released model actually concedes against a
      stated attacker, not what composition admits in worst case.
    condition_logic: "measured_exceeds_target()"
    finding: >
      Measured attack advantage exceeds the deployment's declared target. Either
      retighten the DP parameters (σ, T, q) until the measured rate is within
      target, accept the higher residual explicitly in the chain (updating
      `design_target.attack_target.target_advantage`), or move to a stricter
      stack (e.g. add MPC secure aggregation).
    references:
      - "Carlini et al. (2022) — Membership inference from first principles, §3"
      - "Kulynych et al. (NeurIPS 2024) — Attack-aware noise calibration"

  - id: RISKCAL-005
    name: "Evidence class below what the threat profile requires"
    category: RISKCAL
    severity: AMBER
    description: >
      The card carries `evidence_class: reproducible-record` on a claim that
      the deployment's `threat_profile` indicates should be backed by stronger
      evidence (signed-record or above). A reproducible record is sufficient
      for internal audit-trail discipline but insufficient as dispute evidence
      against a non-trivial adversary. Surfacing the gap on the card is the
      first step toward closing it.
    condition_logic: "any_reproducible_only_evidence() and threat_profile() != 'honest-but-curious-server'"
    finding: >
      One or more `evidence_ref` entries on this card declare
      `evidence_class: reproducible-record` while the threat profile is
      stronger than `honest-but-curious-server`. Upgrade the evidence class on
      the relevant artefacts (signed-record via JWS with WebID-DPoP; or
      hash-chain-committed via the coordinator-side chain).
    references:
      - "Duddu et al. (CODASPY 2025) — Laminator, §3"
      - "Boenisch et al. (EuroS&P 2023) — When the curious abandon honesty, §5"

  - id: RISKCAL-006
    name: "risk_calibration present but threat_profile absent"
    category: RISKCAL
    severity: RED
    description: >
      The risk_calibration block is present but `threat_profile` is missing.
      Every empirical attack rate quoted on a card is calibrated against
      exactly one adversary model, and the rule engine cannot evaluate any
      RISKCAL-* rule without knowing which one. In schema 2.0 the
      `threat_profile` field is required when `risk_calibration` exists.
    condition_logic: "has_risk_calibration() and threat_profile() is None"
    finding: >
      Add `risk_calibration.threat_profile` to the card. Permitted values are
      honest-but-curious-server, malicious-server, malicious-client,
      malicious-coalition, external-only. The choice affects the operationally
      meaningful epsilon star (Boenisch et al. 2023 §5 — shift of ~2x between
      honest-but-curious and malicious-server).
    references:
      - "Boenisch et al. (EuroS&P 2023) — When the curious abandon honesty, §5"

  # ─── CPSDEV — CPS/IoT device-specific assurance ────────────────────────────
  # Added with the 2.0 schema for cards in CPS/IoT deployment contexts. Each
  # rule's docstring carries the academic anchor that motivates it.

  - id: CPSDEV-ATTEST-001
    name: "TEE deployed without attestation evidence"
    category: CPSDEV
    severity: AMBER
    description: >
      A pet_component with `primitive_id: TEE` and `implementation_status:
      deployed` should carry an `attestation_evidence` reference. A deployment
      that claims a TEE without producing the attestation receipt is asserting
      a security property without evidence. The receipt is the artefact that
      lets an independent reviewer confirm the enclave was actually running
      the code the deployment claims.
    condition_logic: "has_primitive('TEE') and primitive_status('TEE') == 'deployed' and not tee_component_has_attestation()"
    finding: >
      A deployed TEE component lacks `attestation_evidence` on the card. Attach
      a reference to the per-round attestation document (or to a sampled subset
      for very long runs) with `evidence_class: signed-record` produced by the
      TEE vendor's attestation service.
    references:
      - "Duddu et al. (CODASPY 2025) — Laminator, §3"
      - "Guo et al. (arXiv:2412.10537 2024) — VerifiableFL, §3"
      - "Trail of Bits (2024) — A few notes on AWS Nitro Enclaves"

  - id: CPSDEV-DEVHET-001
    name: "Heterogeneous device classes across stepwise chain"
    category: CPSDEV
    severity: AMBER
    description: >
      Device-class heterogeneity across a single deployment changes the
      privacy surface in ways scalar (ε, δ) does not represent. Different
      classes (hospital-server, edge-gateway, wearable-simulator) submit
      updates with different update-magnitude statistics, which interact with
      σ in non-obvious ways. When the chain mixes device classes, the
      deployment should explicitly justify the choice and document any
      class-specific calibration.
    condition_logic: "len(set(device_classes())) >= 2"
    finding: >
      Two or more device classes are present in this deployment's
      pet_components. Add a `parameter_notes` entry on each component
      explaining the class-specific configuration (clipping, dropout, training
      step budget) and confirm the measured_advantage was computed against the
      mixed-class distribution rather than a single-class subset.
    references:
      - "Mo et al. (MobiSys 2020) — DarkneTZ, §5"
      - "Gupta et al. (arXiv:2511.00037 2025) — Benchmarking FL frameworks, §4"

  - id: CPSDEV-OTA-001
    name: "Firmware-version provenance not declared"
    category: CPSDEV
    severity: INFO
    description: >
      A CPS/IoT deployment with heterogeneous edge devices should declare the
      minimum firmware version it accepts at participation, and the chain
      should fire RED when a device falls below it. The current schema has no
      first-class field for firmware version on pet_components, so this rule
      is informational only. Its presence is the argument that future
      deployments should report firmware provenance — tee.fail (2024) and
      adjacent work show that side channels concentrate in older silicon.
    condition_logic: "has_device_class('edge-gateway') or has_device_class('wearable-simulator')"
    finding: >
      This deployment includes edge devices. The current schema does not carry
      firmware-version metadata; consider adding `parameters.minimum_firmware`
      to relevant pet_components and re-running this rule when firmware-version
      fields land in the schema.
    references:
      - "tee.fail (2024) — DDR5 row-buffer timing side-channel, §3"

  # ─── SDC — classical statistical disclosure control ────────────────────────
  # SDC (data/primitives.yaml) is a legacy technique, not a modern PET: it has
  # no formal privacy definition, so these rules check for the specific named
  # rule-based artefacts (frequency rule, (n,k)-dominance/p%-rule, secondary
  # suppression pattern) that stand in for an accountant here. SDC-006 exists
  # specifically to keep the legacy/PET distinction visible at evaluation
  # time, not just in prose: a card should not borrow DP's ε-shaped
  # risk_calibration framing for a technique that has no ε to report.

  - id: SDC-001
    name: "SDC — frequency-rule threshold not declared"
    category: SDC
    severity: RED
    description: >
      The frequency rule (minimum cell/population size below which a cell is
      suppressed) is the primary, and often only, falsifiable disclosure rule
      SDC has. Without a declared threshold, there is nothing for a reviewer
      to check the released table against — unlike DP, there is no accountant
      to fall back on if this artefact is absent.
    condition_logic: "has_primitive('SDC') and missing_artefact('frequency-rule')"
    finding: >
      SDC is present but no frequency-rule threshold is recorded. Document
      the minimum cell/population size (e.g. "suppress any cell < 10
      respondents") in required_artefacts before this release can be
      reviewed. For magnitude tables, also declare the (n,k)-dominance or
      p%-rule parameters (see data/primitives.yaml — SDC core_artefacts).
    references:
      - "Hundepool et al. (2012) — Statistical Disclosure Control (Wiley)"
      - "Cox (1980) — Suppression methodology and statistical disclosure control"

  - id: SDC-002
    name: "SDC — secondary suppression pattern not documented"
    category: SDC
    severity: AMBER
    description: >
      A primary-suppressed cell can often be recovered by subtraction from a
      row or column total, or from a second table sharing the same margins.
      Secondary suppression closes this gap by suppressing additional cells —
      but only if the pattern is actually computed and documented, not just
      asserted.
    condition_logic: "has_primitive('SDC') and missing_artefact('secondary suppression')"
    finding: >
      SDC is present but no secondary-suppression pattern is recorded. A
      table with only primary suppression applied is vulnerable to disclosure
      by subtraction. Document which additional cells were suppressed and
      why, including whether the pattern accounts for other releases sharing
      the same margins.
    references:
      - "Cox (1980) — Suppression methodology and statistical disclosure control"

  - id: SDC-003
    name: "SDC — no disclosure-risk evaluation"
    category: SDC
    severity: RED
    description: >
      Because SDC has no formal privacy definition, an empirical or
      procedural disclosure-risk evaluation (singling-out test,
      motivated-intruder simulation) is the only substantive evidence
      available that the applied thresholds actually work for this release —
      mirroring ASSUR-002's requirement for SYN, for the same underlying
      reason.
    condition_logic: "has_primitive('SDC') and missing_artefact('disclosure-risk')"
    finding: >
      SDC is present but no disclosure-risk evaluation artefact is recorded.
      Applying a threshold rule is not itself evidence that the rule was
      adequate for this specific table's shape and population. Document a
      motivated-intruder simulation or singling-out test.
    references:
      - "Hundepool et al. (2012) — Statistical Disclosure Control (Wiley)"
      - "Explorer T1 — SDC core_artefacts"

  - id: SDC-004
    name: "SDC applied without a governed output-checking layer"
    category: SDC
    severity: RED
    description: >
      In practice, SDC's assurance story is almost always paired with human
      output review (P-09): an automated suppression/coarsening pipeline
      running without a TRE-style governed check is exactly the setting in
      which cross-release recovery (see SDC-002) goes uncaught, because no
      reviewer is positioned to notice that this release, combined with a
      prior one, narrows a suppressed cell.
    condition_logic: "has_primitive('SDC') and not has_primitive('TRE')"
    finding: >
      SDC is present without TRE governance. Classical disclosure control
      was built around human output checking as a first-class assurance
      mechanism, not an optional supplement — consider adding TRE (P-09) or
      documenting an equivalent output-clearance workflow.
    references:
      - "Explorer T2 — P-09 (SDC + TRE)"
      - "ONS Safe Outputs guidance (2024)"

  - id: SDC-005
    name: "SDC protecting an AI/ML-model-derived release — re-validation not documented"
    category: SDC
    severity: AMBER
    description: >
      The frequency rule, (n,k)-dominance rule, and p%-rule were designed for
      raw respondent tabulations, where cell counts are the only disclosure
      surface. When the table being protected is itself derived from a
      trained AI/ML model's outputs (a subgroup calibration table, a
      fairness-audit breakdown, a validation-cohort summary), an additional
      surface exists that these thresholds were not designed to bound: an
      adversary with independent knowledge of the model's behaviour may be
      able to narrow a coarsened or suppressed cell using that knowledge,
      not just the published counts. This is genuinely open — the rule fires
      to make the gap visible, not because a standard mitigation exists yet.
    condition_logic: "has_primitive('SDC') and missing_artefact('model-derived')"
    finding: >
      SDC protects a release with no recorded re-validation of whether
      classical thresholds bound disclosure risk for a model-derived table
      specifically. If this release is not model-derived (e.g. a raw
      demographic tabulation), mark this artefact `not-applicable` and state
      why. If it is model-derived, document whatever testing exists — even a
      documented absence of testing is more useful than silence — and treat
      this as an open item, not a solved one.
    references:
      - "data/primitives.yaml — SDC maturity_notes"
      - "Suri et al. (PoPETs 2023) — subject-level MIA in cross-silo FL (analogous surface for model-derived releases)"

  - id: SDC-006
    name: "SDC card carries a DP-shaped risk_calibration block"
    category: SDC
    severity: INFO
    description: >
      The `risk_calibration` block (design_target / accountant /
      empirical_audit / measured_advantage) is built around DP's ε-accountant
      framing. SDC has no formal privacy definition and therefore no ε to
      report. A card that declares both SDC and a populated risk_calibration
      block risks implying a DP-style guarantee SDC does not actually make —
      exactly the legacy-technique-vs-PET conflation this framework is meant
      to keep visible.
    condition_logic: "has_primitive('SDC') and has_risk_calibration()"
    finding: >
      This card declares SDC alongside a populated `risk_calibration` block.
      Confirm the block describes a genuine DP-family component elsewhere in
      `pet_components` — if `risk_calibration` is being used to describe
      SDC's own disclosure risk, that is a category error: document SDC's
      evidence (frequency-rule threshold, disclosure-risk evaluation)
      through `assurance_targets.required_artefacts` instead, and reserve
      `risk_calibration` for a DP-family primitive.
    references:
      - "data/primitives.yaml — SDC trust_model"
      - "GLOSSARY.md §4 — PET-family terms, note on classification fit"
