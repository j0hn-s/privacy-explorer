[project]
name = "workbench"
version = "0.1.0"
description = "Local sandbox for the privacy-explorer framework. WIP — research scaffolding."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "elasticsearch>=8.11,<9",
    "jinja2>=3.1,<4",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.21,<5",
    "python-multipart>=0.0.9,<1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<9",
    "httpx>=0.27,<1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
