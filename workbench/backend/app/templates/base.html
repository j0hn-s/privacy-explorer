<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}Privacy Explorer — Workbench{% endblock %}</title>
  <script src="https://unpkg.com/htmx.org@1.9.12" integrity="sha384-ujb1lZYygJmzgSwoxRggbCHcjc0rB2XoQrxeTUQyRjrOnlCoYta87iKBWq3EsdM2" crossorigin="anonymous"></script>
  <script defer src="https://unpkg.com/alpinejs@3.13.5/dist/cdn.min.js"></script>
  <link rel="stylesheet" href="/static/css/workbench.css" />
</head>
<body>
  <header class="wb-header">
    <div class="wb-brand">
      <a href="/">Privacy Explorer · Workbench</a>
      <span class="wb-wip-badge" title="Research scaffolding, not production">WIP · {{ version }}</span>
    </div>
    <nav class="wb-nav">
      <a href="/">Home</a>
      <a href="/cards">Cards</a>
      <a href="/cards/new">New card</a>
      <a href="/reference">Reference (T0–T4)</a>
    </nav>
  </header>
  <main class="wb-main">
    {% block content %}{% endblock %}
  </main>
  <footer class="wb-footer">
    <small>
      Local sandbox · See <a href="https://github.com/j0hn-s/privacy-explorer/blob/main/workbench/limitations.md">limitations.md</a>.
      Canonical engine: <code>yaps/engine/risk_engine.py</code>.
    </small>
  </footer>
</body>
</html>
